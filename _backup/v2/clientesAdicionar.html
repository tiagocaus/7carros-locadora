<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adicionar Novo Cliente</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="styles/base.css" rel="stylesheet">
    <link href="styles/components.css" rel="stylesheet">
    <link href="styles/utilities.css" rel="stylesheet">
    <link href="styles/custom-classes.css" rel="stylesheet">
    <link href="styles/iframe-pages.css" rel="stylesheet">
    <link href="styles/chosen-select.css" rel="stylesheet">
</head>

<body>
    <div class="form-container p-1 md:p-4">
        <div class="flex justify-between items-center mb-6">
            <h2 class="title-page">Adicionar Novo Cliente</h2>
            <button id="btnVoltarListaClientes" class="btn-secondary flex items-center"><i class="fas fa-arrow-left mr-2"></i>Voltar</button>
        </div>
        <div class="mb-4 border-b border-slate-300">
            <nav class="flex -mb-px" id="formClienteTabsNav">
                <button data-form-tab-target="#formDadosCliente" class="form-tab-button active">Dados</button>
                <button data-form-tab-target="#formArquivosCliente" class="form-tab-button">Arquivos</button>
                <button data-form-tab-target="#formFaturasCliente" class="form-tab-button">Faturas</button>
            </nav>
        </div>
        <div id="formDadosCliente" class="form-tab-content active">
            <div class="form-section">
                <h3 class="form-section-title">Dados do cliente</h3>
                <div class="grid grid-cols-1 md:grid-cols-12 gap-4 items-end">
                    <div class="md:col-span-2 flex flex-col items-center">
                        <img src="https://placehold.co/100x100/E0E0E0/757575?text=Foto" alt="Foto do Cliente" class="w-24 h-24 rounded-full object-cover mb-2 border border-slate-300">
                        <button class="text-sm text-sky-600 hover:text-sky-800"><i class="fas fa-camera mr-1"></i>Tirar foto</button>
                    </div>
                    <div class="md:col-span-5">
                        <label for="clienteMatriz" class="form-label">Matriz/Filial</label>
                        <select id="clienteMatriz" class="chosen-select form-input-focus" data-chosen-type="normal">
                            <option value="">Selecione uma opção...</option>
                            <option value="1">Matriz de teste</option>
                        </select>
                    </div>
                    <div class="md:col-span-5">
                        <label for="clienteSituacao" class="form-label">Situação do cadastro</label>
                        <select id="clienteSituacao" class="chosen-select form-input-focus" data-chosen-type="normal">
                            <option value="">Selecione uma opção...</option>
                            <option value="ativo">Ativo</option>
                            <option value="inativo">Inativo</option>
                        </select>
                    </div>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 mt-4">
                    <div><label for="clienteTipo" class="form-label">Tipo</label><select id="clienteTipo" class="chosen-select form-input" data-chosen-type="normal">
                            <option value="">Selecione uma opção...</option>
                            <option value="pf">Pessoa Física</option>
                            <option value="pj">Pessoa Jurídica</option>
                        </select></div>
                    <div><label for="clienteCPF" class="form-label">CPF</label><input type="text" id="clienteCPF" placeholder="000.000.000-00" class="form-input"></div>
                    <div class="sm:col-span-2 lg:col-span-1"><label for="clienteNome" class="form-label">Nome completo</label><input type="text" id="clienteNome" class="form-input"></div>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4 mt-4">
                    <div><label for="clienteRG" class="form-label">RG</label><input type="text" id="clienteRG" class="form-input"></div>
                    <div><label for="clienteNascimento" class="form-label">Nascimento</label><input type="date" id="clienteNascimento" class="form-input"></div>
                    <div><label for="clienteSexo" class="form-label">Sexo</label><select id="clienteSexo" class="chosen-select form-input" data-chosen-type="normal">
                            <option value="">Selecione uma opção...</option>
                            <option value="masculino">Masculino</option>
                            <option value="feminino">Feminino</option>
                            <option value="outro">Outro</option>
                        </select></div>
                    <div><label for="clienteEstadoCivil" class="form-label">Estado civil</label><select id="clienteEstadoCivil" class="chosen-select form-input" data-chosen-type="normal">
                            <option value="">Selecione uma opção...</option>
                            <option value="solteiro">Solteiro(a)</option>
                            <option value="casado">Casado(a)</option>
                            <option value="divorciado">Divorciado(a)</option>
                            <option value="viuvo">Viúvo(a)</option>
                        </select></div>
                    <div><label for="clienteProfissao" class="form-label">Profissão</label><input type="text" id="clienteProfissao" class="form-input"></div>
                </div>
                <div class="mt-4 w-full sm:w-1/2 lg:w-1/3"><label for="clienteSenha" class="form-label">Senha</label><input type="password" id="clienteSenha" class="form-input"></div>
            </div>
            <div class="form-section">
                <h3 class="form-section-title">Endereço</h3>
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                    <div><label for="clienteCEP" class="form-label">CEP</label><input type="text" id="clienteCEP" placeholder="00000-000" class="form-input"></div>
                    <div class="lg:col-span-2"><label for="clienteRua" class="form-label">Rua</label><input type="text" id="clienteRua" class="form-input"></div>
                    <div><label for="clienteNumero" class="form-label">Nº</label><input type="text" id="clienteNumero" class="form-input"></div>
                    <div><label for="clienteComplemento" class="form-label">Complemento</label><input type="text" id="clienteComplemento" class="form-input"></div>
                    <div><label for="clienteBairro" class="form-label">Bairro</label><input type="text" id="clienteBairro" class="form-input"></div>
                    <div><label for="clienteCidade" class="form-label">Cidade</label><input type="text" id="clienteCidade" class="form-input"></div>
                    <div><label for="clienteEstado" class="form-label">Estado</label><input type="text" id="clienteEstado" class="form-input"></div>
                    <div><label for="clientePais" class="form-label">País</label><input type="text" id="clientePais" value="Brasil" class="form-input"></div>
                </div>
            </div>
            <div class="form-section">
                <h3 class="form-section-title">Contato</h3>
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                    <div class="lg:col-span-2"><label for="clienteEmail" class="form-label">E-mail</label><input type="email" id="clienteEmail" class="form-input"></div>
                    <div><label for="clienteCelular" class="form-label">Tel. Celular (Whatsapp)</label><input type="tel" id="clienteCelular" class="form-input"></div>
                    <div><label for="clienteTelComercial" class="form-label">Tel. Comercial</label><input type="tel" id="clienteTelComercial" class="form-input"></div>
                    <div><label for="clienteTelResidencial" class="form-label">Tel. Residencial</label><input type="tel" id="clienteTelResidencial" class="form-input"></div>
                </div>
            </div>
            <div class="form-section">
                <h3 class="form-section-title">Carteira de Motorista</h3>
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                    <div><label for="clienteCNH" class="form-label">Nº da CNH</label><input type="text" id="clienteCNH" class="form-input"></div>
                    <div><label for="clienteCNHCodSeg" class="form-label">Código de Segurança</label><input type="text" id="clienteCNHCodSeg" class="form-input"></div>
                    <div><label for="clienteCNHCategoria" class="form-label">Categoria</label><input type="text" id="clienteCNHCategoria" class="form-input"></div>
                    <div><label for="clienteCNHValidade" class="form-label">Validade da CNH</label><input type="date" id="clienteCNHValidade" class="form-input"></div>
                </div>
            </div>
            <div class="form-section">
                <h3 class="form-section-title">Dados de Pagamento</h3>
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                    <div><label for="clienteCartaoBandeira" class="form-label">Bandeira</label><select id="clienteCartaoBandeira" class="chosen-select form-input" data-chosen-type="normal">
                            <option value="">Selecione uma opção...</option>
                            <option value="visa">Visa</option>
                            <option value="mastercard">Mastercard</option>
                            <option value="elo">Elo</option>
                        </select></div>
                    <div class="lg:col-span-2"><label for="clienteCartaoNumero" class="form-label">Número do Cartão</label><input type="text" id="clienteCartaoNumero" class="form-input"></div>
                    <div><label for="clienteCartaoValidade" class="form-label">Validade</label><input type="text" id="clienteCartaoValidade" placeholder="MM/AA" class="form-input"></div>
                    <div><label for="clienteCartaoCVV" class="form-label">CVV</label><input type="text" id="clienteCartaoCVV" class="form-input"></div>
                </div>
                <div class="mt-4"><label for="clienteIBAN" class="form-label">IBAN</label><input type="text" id="clienteIBAN" class="form-input"></div>
            </div>
        </div>
        <div id="formArquivosCliente" class="form-tab-content p-4">
            <p class="text-slate-600">Conteúdo da aba Arquivos aqui...</p>
        </div>
        <div id="formFaturasCliente" class="form-tab-content p-4">
            <p class="text-slate-600">Conteúdo da aba Faturas aqui...</p>
        </div>
        <div class="mt-6 flex justify-end space-x-3">
            <button type="button" id="btnCancelarFormCliente" class="btn-secondary hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-sky-500">Cancelar</button>
            <button type="submit" class="btn-blue py-2 px-4 rounded-md text-sm font-medium shadow hover:shadow-md transition-shadow">Salvar Cliente</button>
        </div>
    </div>
    <script>
        (function () {
            // Comunicação com o iframe pai
            document.getElementById('btnVoltarListaClientes')?.addEventListener('click', function () {
                if (window.parent !== window) {
                    window.parent.postMessage({ action: 'navigate', page: 'clientes.html' }, '*');
                }
            });

            const formTabButtons = document.querySelectorAll('#formClienteTabsNav .form-tab-button');
            const formTabContents = document.querySelectorAll('.form-tab-content');
            formTabButtons.forEach(button => {
                button.addEventListener('click', () => {
                    formTabButtons.forEach(btn => btn.classList.remove('active'));
                    button.classList.add('active');
                    formTabContents.forEach(content => content.classList.remove('active'));
                    const targetId = button.dataset.formTabTarget;
                    const targetContent = document.querySelector(targetId);
                    if (targetContent) {
                        targetContent.classList.add('active');
                    }
                });
            });
        })();
    </script>
    <script src="js/chosen-select.js"></script>
</body>

</html>
