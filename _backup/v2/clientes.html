<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Clientes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="styles/base.css" rel="stylesheet">
    <link href="styles/components.css" rel="stylesheet">
    <link href="styles/utilities.css" rel="stylesheet">
    <link href="styles/custom-classes.css" rel="stylesheet">
    <link href="styles/iframe-pages.css" rel="stylesheet">
    <link href="styles/chosen-select.css" rel="stylesheet">
</head>

<body>
    <div class="p-1 md:p-4">
        <div class="clientes-header flex flex-col sm:flex-row justify-between items-center mb-6">
            <h2 class="title-section mb-3 sm:mb-0">Lista de Clientes</h2>
            <div class="flex items-center space-x-3 w-full sm:w-auto">
                <div class="relative flex-grow sm:flex-grow-0">
                    <input type="text" placeholder="Buscar cliente..." class="form-input-focus sm:w-64 pr-8">
                    <i class="fas fa-search absolute right-3 top-1/2 transform -translate-y-1/2 text-slate-400"></i>
                </div>
                <button id="btnAbreLateral" class="btn-yellow py-2 px-3 rounded-md text-sm font-medium flex items-center shadow hover:shadow-md transition-shadow whitespace-nowrap"><i class="fas fa-bars mr-2"></i>Abre Lateral</button>
                <button id="btnAdicionarCliente" class="btn-blue py-2 px-4 rounded-md text-sm font-medium flex items-center shadow hover:shadow-md transition-shadow whitespace-nowrap"><i class="fas fa-plus mr-2"></i>Adicionar Cliente</button>
            </div>
        </div>
        <div class="bg-white shadow-md rounded-lg overflow-x-auto">
            <table class="w-full min-w-full divide-y divide-slate-200">
                <thead class="table-header-custom">
                    <tr>
                        <th class="table-header">ID</th>
                        <th class="table-header">Nome</th>
                        <th class="table-header hidden md:table-cell">Email</th>
                        <th class="table-header hidden lg:table-cell">Telefone</th>
                        <th class="table-header px-2 w-32 text-center">Ações</th>
                    </tr>
                </thead>
                <tbody id="clientesTableBody" class="bg-white divide-y divide-slate-200">
                    <!-- Linhas da tabela serão inseridas aqui pelo JavaScript -->
                </tbody>
            </table>
        </div>
        <div class="table-pagination-controls mt-4 flex flex-wrap justify-between items-center">
            <div>
                <label for="rowsPerPage" class="text-sm text-slate-600 mr-2">Registos por página:</label>
                <select id="rowsPerPage" class="chosen-select form-input-focus select-pagination" data-chosen-type="normal">
                    <option value="10">10</option>
                    <option value="20">20</option>
                    <option value="30">30</option>
                    <option value="50">50</option>
                </select>
            </div>
            <div class="text-sm text-slate-600 mt-2 sm:mt-0">
                <span id="registrosInfo">Mostrando 1-10 de 50 registros</span>
            </div>
            <nav aria-label="Page navigation" class="mt-2 sm:mt-0">
                <ul class="inline-flex items-center -space-x-px">
                    <li><button class="pagination-button arrow-button rounded-l-md" disabled><i class="fas fa-chevron-left"></i></button></li>
                    <li><button class="pagination-button numbered active">1</button></li>
                    <li><button class="pagination-button numbered">2</button></li>
                    <li><button class="pagination-button numbered">3</button></li>
                    <li><button class="pagination-button numbered" disabled>...</button></li>
                    <li><button class="pagination-button numbered">10</button></li>
                    <li><button class="pagination-button arrow-button rounded-r-md"><i class="fas fa-chevron-right"></i></button></li>
                </ul>
            </nav>
        </div>
    </div>
    <script>
        (function () {
            // Comunicação com o iframe pai
            document.getElementById('btnAdicionarCliente')?.addEventListener('click', function () {
                if (window.parent !== window) {
                    window.parent.postMessage({ action: 'navigate', page: 'clientesAdicionar.html' }, '*');
                }
            });

            // Preencher a tabela com os dados dos clientes
            let tableRows = '';
            const clientesExemplo = [
                { id: 1, nome: 'João Silva', email: 'joao.silva@example.com', telefone: '(11) 98765-4321' },
                { id: 2, nome: 'Maria Oliveira', email: 'maria.oliveira@example.com', telefone: '(21) 91234-5678' },
                { id: 3, nome: 'Carlos Pereira', email: 'carlos.pereira@example.com', telefone: '(31) 95555-5555' },
                { id: 4, nome: 'Ana Costa', email: 'ana.costa@example.com', telefone: '(41) 98888-7777' },
                { id: 5, nome: 'Pedro Martins', email: 'pedro.martins@example.com', telefone: '(51) 97777-6666' }
            ];

            clientesExemplo.forEach(cliente => {
                tableRows += '<tr class="border-b border-slate-200 hover:bg-slate-50">' +
                    '<td class="table-cell">' + cliente.id + '</td>' +
                    '<td class="table-cell">' + cliente.nome + '</td>' +
                    '<td class="table-cell hidden md:table-cell">' + cliente.email + '</td>' +
                    '<td class="table-cell hidden lg:table-cell">' + cliente.telefone + '</td>' +
                    '<td class="table-cell px-2 w-32 text-center">' +
                    '<button title="Ver Cliente" class="btn-icon text-sky-600 hover:text-sky-800"><i class="fas fa-eye"></i></button>' +
                    '<button title="Editar Cliente" class="btn-icon text-amber-600 hover:text-amber-800"><i class="fas fa-edit"></i></button>' +
                    '<button title="Excluir Cliente" class="btn-icon text-red-600 hover:text-red-800 btn-delete-client" data-client-id="' + cliente.id + '" data-client-name="' + cliente.nome + '"><i class="fas fa-trash"></i></button>' +
                    '</td>' +
                    '</tr>';
            });

            const tbody = document.querySelector('#clientesTableBody');
            if (tbody) {
                tbody.innerHTML = tableRows;

                // Adicionar event listeners aos botões de excluir
                const deleteButtons = tbody.querySelectorAll('.btn-delete-client');
                deleteButtons.forEach(button => {
                    button.addEventListener('click', function () {
                        const clientId = this.dataset.clientId;
                        const clientName = this.dataset.clientName;
                        const row = this.closest('tr');

                        // Se está dentro de um iframe, comunicar com o pai
                        if (window.parent !== window) {
                            window.parent.postMessage({
                                action: 'openDeleteModal',
                                clientId: clientId,
                                clientName: clientName,
                                rowIndex: Array.from(tbody.querySelectorAll('tr')).indexOf(row)
                            }, '*');
                        } else {
                            // Se não está em iframe, usar função local (caso seja carregado diretamente)
                            if (typeof openDeleteModal === 'function') {
                                openDeleteModal(clientId, clientName, row);
                            }
                        }
                    });
                });
            }
        })();

        // Escutar mensagens do pai para confirmar exclusão
        window.addEventListener('message', function (event) {
            if (event.data && event.data.action === 'confirmDelete') {
                const rowIndex = event.data.rowIndex;
                const tbody = document.querySelector('#clientesTableBody');
                if (tbody && tbody.children[rowIndex]) {
                    tbody.children[rowIndex].remove();
                }
            }
        });
    </script>
    <script src="js/chosen-select.js"></script>
</body>

</html>
