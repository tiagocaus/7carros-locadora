<!DOCTYPE html>
<html lang="pt-PT">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top Bar - Seletor de Sistemas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
        }

        .top-bar {
            background-color: #4A5568;
            position: relative;
            display: flex;
            justify-content: flex-start;
            align-items: flex-end;
            flex-shrink: 0;
        }

        .top-bar-item {
            padding: 0.1rem 1rem;
            line-height: 1.5;
            transition: filter 0.2s ease;
            cursor: pointer;
            color: white;
            text-align: center;
            font-size: 0.75rem;
            white-space: nowrap;
        }

        .top-bar-item:hover {
            filter: brightness(1.15);
        }

        .top-bar-item-locadora {
            background-color: #3B82F6;
        }

        .top-bar-item-oficina {
            background-color: #78716C;
        }

        .top-bar-item-autopecas {
            background-color: #10B981;
        }

        .top-bar-item-vistoria {
            background-color: #F59E0B;
        }

        .top-bar-item-revenda {
            background-color: #64748B;
        }

        .top-bar-item.active-system {
            background-color: #438eb9;
            color: white;
            position: relative;
            z-index: 10;
            padding-bottom: 0.25rem;
            margin-bottom: 0;
            border-top-left-radius: 0.25rem;
            border-top-right-radius: 0.25rem;
        }

        .top-bar-item.active-system::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-top: 4px solid #438eb9;
        }

        @media (max-width: 768px) {
            .top-bar {
                flex-wrap: nowrap;
                overflow-x: auto;
                scrollbar-width: none;
                -ms-overflow-style: none;
            }

            .top-bar::-webkit-scrollbar {
                display: none;
            }
        }
    </style>
</head>

<body>
    <div class="top-bar text-white text-xs flex shadow-sm relative">
        <span class="top-bar-item top-bar-item-locadora active-system">Locadora de veículo</span>
        <span class="top-bar-item top-bar-item-oficina">Oficina mecânica</span>
        <span class="top-bar-item top-bar-item-autopecas">Auto peças</span>
        <span class="top-bar-item top-bar-item-vistoria">Vistoria veicular</span>
        <span class="top-bar-item top-bar-item-revenda">Revenda de veículos</span>
    </div>
</body>

</html>
